[project]
name = "vl1"
version = "0.1.0"
description = "ВЛ1: Рейнеке — M1 Simulation Core (headless, deterministic, без LLM)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
vl1 = "app.simulation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: длинные интеграционные прогоны (30 дней, детерминизм)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
